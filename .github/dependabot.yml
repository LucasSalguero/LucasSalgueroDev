version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-y-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      herramientas:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Las versiones mayores se migran a mano, con su propio PR (el stack está
      # fijado en Next.js 15: ver docs/adr/0001).
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
